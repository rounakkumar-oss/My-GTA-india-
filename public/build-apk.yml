name: Build Indian GTA 6 Android APK

on:
  push:
    paths-ignore:
      - "Indian-GTA-6.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Landscape Fullscreen Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project & Wrap index.html
        run: |
          rm -rf /tmp/indian-gta6-apk
          mkdir -p /tmp/indian-gta6-apk/www
          cp index.html /tmp/indian-gta6-apk/www/index.html
          cd /tmp/indian-gta6-apk

          cat << 'EOF' > package.json
          {
            "name": "indian-gta-6-openworld",
            "version": "1.0.0",
            "description": "Bharat Vice: Indian Open-World 3D Action Game",
            "private": true
          }
          EOF

          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bharatvice.indiangta6",
            "appName": "Indian GTA 6",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure Landscape 16:9 Fullscreen, Cleartext & Immersive Mode
        run: |
          cd /tmp/indian-gta6-apk

          python3 - << 'PYEOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml = f.read()

          if "android.permission.INTERNET" not in xml:
              xml = xml.replace(
                  "</manifest>",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n'
                  '</manifest>'
              )

          if "android:usesCleartextTraffic" not in xml:
              xml = xml.replace(
                  "<application",
                  '<application\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true"'
              )

          if "android:screenOrientation" not in xml:
              xml = xml.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"'
              )
          else:
              xml = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="sensorLandscape"',
                  xml
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml)
          PYEOF

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'JAVAEOF' > "$MAIN_ACT"
          package com.bharatvice.indiangta6;

          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  enableImmersiveFullscreen();

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableImmersiveFullscreen();
                  }
              }

              private void enableImmersiveFullscreen() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          JAVAEOF
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd /tmp/indian-gta6-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Indian-GTA-6.apk"
          ls -lh "$GITHUB_WORKSPACE/Indian-GTA-6.apk"

      - name: Save Indian-GTA-6.apk Directly into GitHub Repo Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Indian-GTA-6.apk
          git diff --staged --quiet || (git commit -m "Auto-build Indian-GTA-6.apk [skip ci]" && git push)

      - name: Upload Indian-GTA-6-APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Indian-GTA-6-APK
          path: Indian-GTA-6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct .APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Indian GTA 6 Android APK (v1.0.${{ github.run_number }})"
          body: |
            ### Bharat Vice: Indian GTA 6 Open-World Android APK
            Niche **Assets** me **`Indian-GTA-6.apk`** par click karke seedha apne phone me download aur install karein!
          files: Indian-GTA-6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
