name: Build Indian GTA 6 Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "Indian-GTA-6.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Landscape Fullscreen Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build & Sign Landscape Fullscreen Indian-GTA-6.apk
        run: |
          set -e
          if [ -f "public/apk-base64.txt" ]; then
            tr -d ' \t\r\n' < public/apk-base64.txt | base64 -d > "$GITHUB_WORKSPACE/Indian-GTA-6.apk"
            echo "Decoded pre-signed Indian-GTA-6.apk from public/apk-base64.txt"
          fi

          # Also support full native Android SDK compilation from index.html if SDK is available
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          PLATFORM_DIR=$(ls -d "$ANDROID_SDK/platforms/android-"* 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -n "$BUILD_TOOLS" ] && [ -n "$PLATFORM_DIR" ] && [ -f "$PLATFORM_DIR/android.jar" ]; then
            export PATH="$BUILD_TOOLS:$PATH"
            ANDROID_JAR="$PLATFORM_DIR/android.jar"
            rm -rf /tmp/apk-proj
            mkdir -p /tmp/apk-proj/src/com/bharatvice/indiangta6
            mkdir -p /tmp/apk-proj/res/drawable
            mkdir -p /tmp/apk-proj/res/values
            mkdir -p /tmp/apk-proj/assets
            mkdir -p /tmp/apk-proj/obj

            cp index.html /tmp/apk-proj/assets/index.html
            if [ -f "public/pwa-192x192.png" ]; then
              cp public/pwa-192x192.png /tmp/apk-proj/res/drawable/ic_launcher.png
            else
              python3 -c 'import base64; open("/tmp/apk-proj/res/drawable/ic_launcher.png","wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="))'
            fi

            cat << 'EOF' > /tmp/apk-proj/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Indian GTA 6</string>
          </resources>
          EOF

            cat << 'EOF' > /tmp/apk-proj/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.bharatvice.indiangta6"
              android:versionCode="1"
              android:versionName="1.0.0">
              <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

            cat << 'EOF' > /tmp/apk-proj/src/com/bharatvice/indiangta6/MainActivity.java
          package com.bharatvice.indiangta6;
          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#090A0F"));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

            aapt package -f -m -J /tmp/apk-proj/src -M /tmp/apk-proj/AndroidManifest.xml -S /tmp/apk-proj/res -I "$ANDROID_JAR"
            javac --release 11 -d /tmp/apk-proj/obj -classpath "$ANDROID_JAR" /tmp/apk-proj/src/com/bharatvice/indiangta6/R.java /tmp/apk-proj/src/com/bharatvice/indiangta6/MainActivity.java
            d8 --lib "$ANDROID_JAR" --output /tmp/apk-proj/ /tmp/apk-proj/obj/com/bharatvice/indiangta6/*.class
            aapt package -f -M /tmp/apk-proj/AndroidManifest.xml -S /tmp/apk-proj/res -A /tmp/apk-proj/assets -I "$ANDROID_JAR" -F /tmp/apk-proj/unaligned.apk
            (cd /tmp/apk-proj && aapt add unaligned.apk classes.dex)
            zipalign -f 4 /tmp/apk-proj/unaligned.apk /tmp/apk-proj/aligned.apk
            keytool -genkeypair -v -keystore /tmp/apk-proj/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
            apksigner sign --ks /tmp/apk-proj/debug.keystore --ks-pass pass:android --key-pass pass:android --out "$GITHUB_WORKSPACE/Indian-GTA-6.apk" /tmp/apk-proj/aligned.apk
          fi

          ls -lh "$GITHUB_WORKSPACE/Indian-GTA-6.apk"

      - name: Save Indian-GTA-6.apk Directly into GitHub Repo Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Indian-GTA-6.apk
          git diff --staged --quiet || (git commit -m "Auto-build Indian-GTA-6.apk [skip ci]" && git push)

      - name: Upload Indian-GTA-6-APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Indian-GTA-6-APK
          path: Indian-GTA-6.apk
          if-no-files-found: error

      - name: Publish Direct .APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Indian GTA 6 Android APK (v1.0.${{ github.run_number }})"
          body: |
            ### 🇮🇳 Bharat Vice: Indian GTA 6 (3D Open-World Android APK)
            - **Direct Install:** Tap `Indian-GTA-6.apk` below to download and install directly on your Android phone.
            - **Orientation:** Locked to 16:9 Widescreen Sensor Landscape Fullscreen.
          files: Indian-GTA-6.apk
          draft: false
          prerelease: false
